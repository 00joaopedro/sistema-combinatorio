<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Sistema Combinatório</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">LOTOFÁCIL</p>
      <h1>Sistema Combinatório</h1>
      <p>Consulte estatísticas e prepare suas cartelas em um só lugar.</p>
    </header>
    <section aria-labelledby="frequencia">
      <span class="number" aria-hidden="true">01</span>
      <div><h2 id="frequencia">Frequência das dezenas</h2><p>Em breve, consulte os resultados dos últimos concursos.</p></div>
    </section>
    <section aria-labelledby="cartelas">
      <span class="number" aria-hidden="true">02</span>
      <div><h2 id="cartelas">Gerador de cartelas</h2><p>Em breve, crie jogos com as dezenas de sua escolha.</p></div>
    </section>
  </main>
</body>
</html>
